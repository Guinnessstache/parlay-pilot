name: probe
on: { push: { branches: [probe4] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          curl -sS "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=401872994" -o probe/sum.json
          curl -sS "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" -o probe/sb.json
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add probe; git commit -m "probe [skip ci]"; git push
