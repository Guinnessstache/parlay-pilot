name: probe
on: { push: { branches: [probe3] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          for u in "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard"; do
            curl -sS -D - -o probe/scoreboard.json -H "Origin: https://guinnessstache.github.io" "$u" | grep -i -E "^HTTP|access-control" > probe/headers.txt
          done
          EV=$(node -e "const s=require('./probe/scoreboard.json');const e=s.events.find(e=>e.status.type.state!=='pre')||s.events[0];console.log(e.id)")
          curl -sS -D - -o probe/summary.json -H "Origin: https://guinnessstache.github.io" "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=$EV" | grep -i -E "^HTTP|access-control" >> probe/headers.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add probe; git commit -m "probe [skip ci]"; git push
