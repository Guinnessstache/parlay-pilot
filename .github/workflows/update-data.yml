name: Refresh data & deploy site

# FREE-PLAN SETTINGS (The Odds API, 500 credits/month)
# Each run costs ~3 credits for main lines on every game, plus ~3 credits per game
# for alt spreads / alt totals / anytime TD on the next 2 games kicking off within 12 h.
# Worst case ~9 credits/run x 3 runs x Thu/Sun/Mon ≈ 350 credits/month, leaving
# ~150 for manual "Run workflow" clicks. Check data/meta.json -> credits_remaining.
#
# Upgraded to a paid plan? Bump EVENT_WINDOW_HOURS to 36, MAX_EVENTS to 16, add the
# player yardage markets back to EVENT_MARKETS, and widen the cron (see README).

on:
  push:
    branches: [main]
    paths-ignore: ['data/**']   # code pushes just redeploy; they don't spend credits
  workflow_dispatch: {}
  schedule:
    # UTC times. 14:07 / 19:07 / 23:07 UTC = 10:07am / 3:07pm / 7:07pm Eastern (EDT).
    # Days: 0 = Sun, 1 = Mon, 4 = Thu (NFL game days).
    - cron: '7 14,19,23 * * 0,1,4'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch odds + injuries
        if: github.event_name != 'push'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          INCLUDE_EVENT_MARKETS: 'true'
          EVENT_WINDOW_HOURS: '12'
          MAX_EVENTS: '2'
          EVENT_MARKETS: 'alternate_spreads,alternate_totals,player_anytime_td'
          CREDIT_RESERVE: '25'
        run: node scripts/fetch-data.mjs

      - name: Commit data snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "parlay-bot"
          git config user.email "parlay-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no data changes"; else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - name: Package site
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll
          # cache-bust: browsers keep Pages files ~10 min, so version every asset URL per deploy
          V=${GITHUB_SHA::7}
          sed -i "s#assets/style.css#assets/style.css?v=$V#; s#assets/app.js#assets/app.js?v=$V#" _site/index.html
          # version every relative module import in every script (app.js, live.js, …)
          sed -i -E "s#from '\./([A-Za-z0-9_-]+)\.js'#from './\1.js?v=$V'#g" _site/assets/*.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
