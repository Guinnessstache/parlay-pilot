name: Refresh data & deploy site

# FREE-PLAN SETTINGS (The Odds API, 500 credits/month)
# Each run costs ~3 credits for main lines on every game, plus ~3 credits per game
# for alt spreads / alt totals / anytime TD on up to 2 games kicking off within 40 h
# (skipping games pulled in the last 6 h; earlier pulls carry forward until kickoff).
# Yardage props (pass/rush/rec yds, receptions) add 4 credits per game and are only pulled
# within 12 h of kickoff or on a Sync, and stop automatically below 150 credits left.
# Typical week ≈ 100-110 credits (≈ 450/month); a Sync costs ~10 credits. Check data/meta.json -> credits_remaining.
#
# Upgraded to a paid plan? Bump EVENT_WINDOW_HOURS to 36, MAX_EVENTS to 16, add the
# player yardage markets back to EVENT_MARKETS, and widen the cron (see README).

on:
  push:
    branches: [main]
    paths-ignore: ['data/**']   # code pushes just redeploy; they don't spend credits
  workflow_dispatch:
    inputs:
      event_ids:
        description: 'Odds API event id(s) to pull alt lines + props for (comma list). Blank = next games automatically.'
        required: false
        default: ''
  schedule:
    # UTC times. 14:07 / 19:07 / 23:07 UTC = 10:07am / 3:07pm / 7:07pm Eastern (EDT).
    # Days: 0 = Sun, 1 = Mon, 4 = Thu (NFL game days).
    - cron: '7 14,19,23 * * 0,1,4'
    # Off days (Tue/Wed/Fri/Sat): one morning refresh so newly posted lines show up (~3 credits each).
    - cron: '7 13 * * 2,3,5,6'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the data commit can rebase onto a newer main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch odds + injuries
        if: github.event_name != 'push'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          INCLUDE_EVENT_MARKETS: 'true'
          EVENT_WINDOW_HOURS: '40'     # props for games within ~1.5 days (props carry forward between runs)
          MAX_EVENTS: '2'               # at most 2 games' props per run (~3 credits each)
          PROPS_FRESH_HOURS: '6'        # don't re-pull a game whose props are under 6 h old
          EVENT_IDS: ${{ github.event.inputs.event_ids }}
          EVENT_MARKETS: 'alternate_spreads,alternate_totals,player_anytime_td'
          # yardage props (+4 credits per game) only within 12 h of kickoff or on a Sync; off below 150 credits
          FULL_MARKETS: 'player_pass_yds,player_rush_yds,player_reception_yds,player_receptions'
          FULL_WINDOW_HOURS: '12'
          FULL_MIN_CREDITS: '150'
          CREDIT_RESERVE: '25'
        run: node scripts/fetch-data.mjs

      - name: Commit data snapshot
        if: github.event_name != 'push'
        continue-on-error: true   # never block the deploy over the history snapshot
        run: |
          git config user.name "parlay-bot"
          git config user.email "parlay-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no data changes"; else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            # main may have moved on (new code, or a re-run of an older run): replay this fresh data on top
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin HEAD:main && break
              sleep 5
            done
          fi

      - uses: actions/configure-pages@v5
      - name: Package site
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll
          # cache-bust: browsers keep Pages files ~10 min, so version every asset URL per deploy
          V=${GITHUB_SHA::7}
          sed -i "s#assets/style.css#assets/style.css?v=$V#; s#assets/app.js#assets/app.js?v=$V#" _site/index.html
          # version every relative module import in every script (app.js, live.js, …)
          sed -i -E "s#from '\./([A-Za-z0-9_-]+)\.js'#from './\1.js?v=$V'#g" _site/assets/*.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
